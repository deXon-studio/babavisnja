<!doctype html><html lang="sr-Cyrl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#282724"><title>Баба Вишња — Резервације, прославе и поруџбине</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#252421;--surface:#302d29;--surface2:#39352f;--text:#faf4e8;--muted:#d0c5b1;--gold:#dfb857;--line:#706044;--input:#282622;--accentText:#231b10;color-scheme:dark}
:root[data-theme=light]{--bg:#fffdfa;--surface:#fffaf0;--surface2:#f5ecd9;--text:#32291d;--muted:#65594a;--gold:#a5792f;--line:#d4bd8c;--input:#fff;--accentText:#21180d;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Playfair Display",Georgia,serif;line-height:1.55}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.shell{max-width:930px;margin:auto;padding:18px 18px 60px}.header{display:flex;justify-content:space-between;align-items:center;gap:15px}.header-controls{display:flex;gap:8px;align-items:center}.header-controls button{white-space:nowrap}.logo{width:106px;height:105px;object-fit:contain}.theme,.ghost{border:1px solid var(--line);background:transparent;color:var(--text);padding:11px 16px;border-radius:5px}.hero{text-align:center;padding:20px 0 28px}.overline{font-size:12px;letter-spacing:.11em;color:var(--gold)}h1{font-size:clamp(32px,6vw,56px);line-height:1.17;font-weight:500;margin:10px 0}h2{font-size:clamp(25px,4vw,34px);line-height:1.3;font-weight:500;margin:0 0 10px}h3{font-size:20px;margin:12px 0}p{color:var(--muted)}.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:clamp(18px,4vw,35px)}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:23px 0}.choice{background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:19px;text-align:left;min-height:128px}.choice strong{font-size:21px;color:var(--gold);display:block}.choice small{color:var(--muted);display:block;margin-top:8px;font-size:14px}.choice:hover,.choice[aria-pressed=true]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}.step{color:var(--gold);font-size:13px;letter-spacing:.06em;margin-bottom:14px}.progress{height:3px;background:var(--surface2);margin-bottom:22px}.progress span{display:block;height:100%;background:var(--gold)}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:22px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:15px}input,select,textarea{width:100%;min-height:48px;padding:11px 12px;background:var(--input);color:var(--text);border:1px solid var(--line);border-radius:5px}textarea{min-height:108px;resize:vertical}.hint{font-size:13px;color:var(--muted)}.actions,.channels{display:flex;flex-wrap:wrap;gap:11px;margin-top:24px}.primary,.channel{border:0;border-radius:5px;padding:12px 18px;background:linear-gradient(120deg,#e7ca77,#bd8b3b);color:var(--accentText);font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;min-height:48px}.primary:disabled{opacity:.45}.channel{font-size:15px}.notice{font-size:14px}.summary{font-family:Arial,Helvetica,sans-serif;line-height:1.65;background:var(--input);border:1px solid var(--line);border-radius:6px;padding:18px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}.check{display:flex;align-items:flex-start;gap:10px;margin-top:16px}.check input{width:18px;min-height:18px;margin-top:5px;flex:none}.divider{height:1px;background:var(--line);margin:24px 0}.foot{text-align:center;font-size:13px;margin-top:25px}.wolt{display:inline-block;margin-top:10px}.status{min-height:22px;color:var(--gold)}@media(max-width:580px){.cards,.fields{grid-template-columns:1fr}.choice{min-height:100px}.header-controls{gap:5px}.header-controls button{padding:9px 10px;font-size:13px}.logo{width:85px;height:88px}.actions>*{flex:1}.channels>*{flex:1 1 100%}}@media print{body{background:white;color:black}.header,.hero,.actions,.channels,.notice,.foot,.progress,.step,.theme{display:none!important}.panel{border:0;padding:0}.summary{border:0;color:black;white-space:pre-wrap}.shell{padding:0}}
.menu-section{margin:27px 0}.menu-section h3{font-size:16px;letter-spacing:.04em;color:var(--gold);border-bottom:1px solid var(--line);padding-bottom:9px}.menu-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.menu-item{background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:13px;display:flex;align-items:center;justify-content:space-between;gap:10px}.menu-item-name{display:flex;flex-direction:column;gap:4px;min-width:0}.menu-item-name strong{font-size:15px;font-weight:500;line-height:1.35}.menu-item-name small{color:var(--gold);font-size:13px}.quantity{display:flex;align-items:center;gap:6px;flex-shrink:0}.quantity button{width:35px;height:35px;border:1px solid var(--line);background:var(--input);color:var(--text);border-radius:5px;font-family:Arial,sans-serif;font-size:21px}.quantity output{min-width:20px;text-align:center;font-family:Arial,sans-serif;font-size:15px}.cart-footer{position:sticky;bottom:8px;z-index:2;background:var(--surface);border:1px solid var(--gold);padding:15px;border-radius:8px;box-shadow:0 7px 28px #0004}.cart-total{font-size:21px;color:var(--gold)}.cart-footer .actions{margin-top:12px}.pickup-alert{margin-top:18px;padding:15px;border-left:3px solid var(--gold);background:var(--surface2);font-weight:600;line-height:1.6}@media(max-width:700px){.menu-items{grid-template-columns:1fr}}@media print{.cart-footer{display:none}}

.menu-section{border:1px solid var(--line);border-radius:8px;margin:13px 0;overflow:hidden;background:var(--surface2)}
.menu-heading{display:flex;align-items:center;justify-content:space-between;gap:14px;cursor:pointer;padding:17px 19px;list-style:none;color:var(--text)}
.menu-heading::-webkit-details-marker{display:none}.menu-heading-title{font-size:20px;font-weight:600;line-height:1.3}.menu-heading-title small{display:block;font-size:12px;font-weight:400;color:var(--gold);margin-top:5px;letter-spacing:.015em}
.menu-chevron{font-family:Arial,sans-serif;font-size:32px;line-height:1;transition:transform .2s;color:var(--gold)}.menu-section[open] .menu-chevron{transform:rotate(180deg)}
.menu-section .menu-items{padding:0 15px 12px}.menu-heading:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.calendar-picker{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;background:var(--input);border:1px solid var(--line);border-radius:8px;padding:18px}
.calendar-month-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:13px}.calendar-month-nav strong{text-transform:capitalize;font-size:17px;text-align:center}
.calendar-month-nav button{width:39px;height:39px;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:5px;font:25px Arial,sans-serif}
.calendar-month-nav button:disabled{opacity:.25;cursor:not-allowed}
.calendar-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.calendar-weekday{text-align:center;font-size:12px;color:var(--muted);padding:8px 0}
.calendar-day{min-width:0;aspect-ratio:1;border:1px solid transparent;border-radius:5px;color:var(--text);background:var(--surface2);font-size:14px;padding:0}
.calendar-day:hover:not(:disabled),.calendar-time:hover:not(:disabled){border-color:var(--gold)}.calendar-day:disabled,.calendar-time:disabled{opacity:.25;cursor:not-allowed}
.calendar-day.selected,.calendar-time.selected{border-color:var(--gold);background:var(--gold);color:var(--accentText);font-weight:700}
.calendar-right>strong{font-size:17px}.calendar-hint{font-size:12px;margin:5px 0 13px}.calendar-times{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;max-height:290px;overflow:auto;align-content:start;padding-right:4px}
.calendar-time{min-height:41px;background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:7px 3px;font-size:14px;font-variant-numeric:tabular-nums}
.calendar-selected{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;padding:13px 16px;border:1px solid var(--line);border-radius:6px;font-size:14px}.calendar-selected span{color:var(--muted)}
@media(max-width:680px){.calendar-picker{grid-template-columns:1fr;gap:20px;padding:13px}.calendar-times{max-height:none;grid-template-columns:repeat(4,minmax(0,1fr))}.calendar-selected{align-items:flex-start;flex-direction:column;gap:3px}.calendar-day{min-height:39px}.menu-heading{padding:15px}}
@media(max-width:380px){.calendar-times{grid-template-columns:repeat(3,minmax(0,1fr))}}

 }

 lines.push("",en?"Please confirm availability and any applicable arrangements.":"Молим вас да проверите расположивост и пошаљете потврду или понуду.");
 lines.push(state.kind==="pickup"?(en?"Please wait for the restaurant to confirm acceptance of your order. Payment is made at the restaurant on collection; no online payment is taken.":"Сачекајте потврду ресторана о пријему поруџбине. Плаћање је у ресторану приликом преузимања; нема онлајн наплате."):(en?"This is an enquiry, not a confirmed booking.":"Ово је упит, а не потврђена резервација."));
 return lines.join("\n");

const s=steps(),end=s.length;if(state.kind==="pickup"&&state.step===0){renderPickupMenu();return}const progress=Math.round((state.step+1)/(end+2)*100);if(state.step<=end){const fs=state.step===end?contact:s[state.step];app.innerHTML=`<div class="step">КОРАК ${state.step+1} ОД ${end+2}</div><div class="progress"><span style="width:${progress}%"></span></div><h2>${state.step===end?"Контакт подаци":titles[state.kind]}</h2><form id="form"><div class="fields">${fs.map(fieldHTML).join("")}</div><div class="actions"><button class="ghost" type="button" id="back">Назад</button><button class="primary" type="submit">${state.step===end?"Преглед упита":"Настави"}</button></div></form>`;if(fs.some(f=>f.type==="date"))calendarSlots();document.getElementById("back").onclick=()=>{if(state.step===0){if(state.kind==="event"){delete state.data._mode;render()}else reset()}else{state.step--;render()}};document.getElementById("form").onsubmit=e=>{e.preventDefault();const form=e.currentTarget;if(fs.some(f=>f.type==="date")&&(!state.data.date||!state.data.time)){alert(locale==="en"?"Please select a date and time.":"Изаберите датум и време.");return;}new FormData(form).forEach((v,k)=>state.data[k]=String(v).trim());if(state.data.guests&&(+state.data.guests<1||+state.data.guests>70)){alert("Број гостију мора бити између 1 и 70.");return}if(state.data.children&&+state.data.children>+state.data.guests){alert("Број деце не може бити већи од укупног броја гостију.");return}if(state.data.date&&state.data.date<today()){alert("Изаберите данашњи или будући датум.");return}state.step++;render()};return}
const message=buildMessage();const wa=`https://wa.me/${PHONE}?text=${encodeURIComponent(message)}`,mail=`mailto:${EMAIL}?subject=${encodeURIComponent((locale==="en"?"Baba Višnja | ":"Баба Вишња | ")+tr(titles[state.kind])+" | "+(state.data.date||today()))}&body=${encodeURIComponent(message)}`,viber=`viber://chat?number=%2B${PHONE}`;app.innerHTML=`<div class="step">КОРАК ${end+2} ОД ${end+2}</div><div class="progress"><span style="width:100%"></span></div><h2>Преглед вашег упита</h2><div class="summary" id="summary">${E(message)}</div>${state.kind==="pickup"?`<div class="pickup-alert">${locale==="en"?"Please wait for the restaurant to confirm your order. Pay by cash or card at the restaurant when collecting. No online payment.":"Сачекајте потврду ресторана о пријему поруџбине. Плаћање готовином или картицом у локалу приликом преузимања. Нема онлајн плаћања."}</div>`:""}<label class="check"><input type="checkbox" id="agree"><span>Потврђујем да су подаци тачни и разумем да слањем упита не добијам аутоматску потврду термина.</span></label><div class="channels"><a class="channel" id="wa" href="${E(wa)}" target="_blank" rel="noopener noreferrer">Отвори Вотсап</a><a class="channel" id="mail" href="${E(mail)}">Отвори имејл</a><a class="channel" id="viber" href="${E(viber)}">Отвори Вајбер</a></div><p class="notice">Порука је уредно форматирана. У изабраној апликацији проверите садржај и потврдите слање. За Вајбер копирајте текст упита.</p><div class="actions"><button class="ghost" id="copy">Копирај упит</button><button class="ghost" id="print">Сачувај као ПДФ</button><button class="ghost" id="edit">Измени</button><button class="ghost" id="new">Нови упит</button></div><p class="status" id="status" role="status"></p>`;const links=["wa","mail","viber"].map(id=>document.getElementById(id));links.forEach(a=>{a.style.pointerEvents="none";a.style.opacity=".45";a.setAttribute("aria-disabled","true")});document.getElementById("agree").onchange=e=>links.forEach(a=>{a.style.pointerEven function today(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")}
function fieldHTML(f){
 if(f.type==="date")return `<div class="field full date-slot"><label>${E(f.label)}</label><div class="date-slot-mount" id="date-slot-mount"></div></div>`;
 if(f.type==="time")return "";
 const val=state.data[f.key]??"",req=f.required===false?"":"required";
 let control=f.type==="textarea"?`<textarea id="f_${f.key}" name="${f.key}" ${req}>${E(val)}</textarea>`:f.type==="select"?`<select id="f_${f.key}" name="${f.key}" ${req}><option value="">Изаберите</option>${f.options.map(o=>`<option value="${E(o)}" ${o===val?"selected":""}>${E(o)}</option>`).join("")}</select>`:`<input id="f_${f.key}" name="${f.key}" type="${f.type}" value="${E(val)}" ${req} ${f.min!=null?`min="${f.min}"`:""} ${f.max!=null?`max="${f.max}"`:""}>`;
 return `<div class="field ${f.type==="textarea"?"full":""}"><label for="f_${f.key}">${E(f.label)}</label>${control}</div>`;
}
function pad2(n){return String(n).padStart(2,"0")}
function calendarSlots(){
 const en=locale==="en",d=state.data;
 const now=new Date(),minDate=today();
 const selected=d.date&&d.date>=minDate?d.date:"";
 const viewing=selected?new Date(selected+"T12:00:00"):new Date(now.getFullYear(),now.getMonth(),1,12);
 let yr=viewing.getFullYear(),mo=viewing.getMonth();
 const maxMinutes=state.kind==="event"?1440:1290; // 00:00 for events; 21:30 for pickup/table
 const clockTimes=[];for(let n=480;n<=maxMinutes;n+=30)clockTimes.push(n===1440?"00:00":pad2(Math.floor(n/60))+":"+pad2(n%60));
 const formatDate=(y,m,day)=>`${y}-${pad2(m+1)}-${pad2(day)}`;
 const renderMonth=()=>{
   const first=(new Date(yr,mo,1).getDay()+6)%7,days=new Date(yr,mo+1,0).getDate();
   const heading=new Intl.DateTimeFormat(en?"en-GB":"sr-RS",{month:"long",year:"numeric"}).format(new Date(yr,mo,1));
   const grid=document.getElementById("calendar-days");if(!grid)return;
   document.getElementById("calendar-month").textContent=heading;
   document.getElementById("calendar-prev").disabled=(yr===now.getFullYear()&&mo===now.getMonth());
   grid.innerHTML=(en?["M","T","W","T","F","S","S"]:["П","У","С","Ч","П","С","Н"]).map(x=>`<span class="calendar-weekday">${x}</span>`).join("")+Array(first).fill('<span aria-hidden="true"></span>').join("")+Array.from({length:days},(_,i)=>{const date=formatDate(yr,mo,i+1),disabled=date<minDate;return `<button type="button" class="calendar-day ${d.date===date?"selected":""}" data-cal-date="${date}" ${disabled?"disabled":""} aria-pressed="${d.date===date}">${i+1}</button>`}).join("");
   grid.querySelectorAll("[data-cal-date]").forEach(b=>b.onclick=()=>{d.date=b.dataset.calDate;renderMonth();renderTimes();});
 };
 const renderTimes=()=>{
  const root=document.getElementById("calendar-times");if(!root)return;
  const sameDay=d.date===today();const currentMinutes=now.getHours()*60+now.getMinutes();
  root.innerHTML=clockTimes.map(t=>{const n=t==="00:00"?1440:Number(t.slice(0,2))*60+Number(t.slice(3));const disabled=!d.date||(sameDay&&n<=currentMinutes);return `<button type="button" class="calendar-time ${d.time===t?"selected":""}" data-cal-time="${t}" ${disabled?"disabled":""} aria-pressed="${d.time===t}">${t}</button>`}).join("");
  root.querySelectorAll("[data-cal-time]").forEach(b=>b.onclick=()=>{d.time=b.dataset.calTime;renderTimes();});
  const label=document.getElementById("calendar-selection");label.textContent=d.date&&d.time?`${new Intl.DateTimeFormat(en?"en-GB":"sr-RS",{day:"numeric",month:"long",year:"numeric"}).format(new Date(d.date+"T12:00:00"))} · ${d.time}`:(en?"Select a date and time":"Изаберите датум и време");
 };
 const mount=document.getElementById("date-slot-mount");if(!mount)return;
 mount.innerHTML=`<div class="calendar-picker"><div class="calendar-left"><div class="calendar-month-nav"><button type="button" id="calendar-prev" aria-label="${en?"Previous month":"Претходни месец"}">‹</button><strong id="calendar-month"></strong><button type="button" id="calendar-next" aria-label="${en?"Next month":"Следећи месец"}">›</button></div><div class="calendar-days" id="calendar-days"></div></div><div class="calendar-right"><strong>${en?"Choose a time":"Изаберите време"}</strong><p class="calendar-hint">${en?"Every 30 minutes · subject to confirmation":"На 30 минута · ресторан потврђује термин"}</p><div class="calendar-times" id="calendar-times"></div></div></div><div class="calendar-selected"><span>${en?"Your selection":"Ваш избор"}</span><strong id="calendar-selection"></strong></div>`;
 document.getElementById("calendar-prev").onclick=()=>{mo--;if(mo<0){mo=11;yr--;}renderMonth()};
 document.getElementById("calendar-next").onclick=()=>{mo++;if(mo>11){mo=0;yr++;}renderMonth()};
 renderMonth();renderTimes();
}

function tr(value){const str=String(value??"");return locale==="en"?(translations[str]??str):str}
function localizeUI(){
 document.documentElement.lang=locale==="en"?"en":"sr-Cyrl";
 document.title=tr("Баба Вишња — Резервације, прославе и поруџбине");
 const btn=document.getElementById("lang");btn.textContent=locale==="en"?"ЋИР":"EN";btn.setAttribute("aria-label",locale==="en"?"Пребаци на српски":"Switch to English");
 const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
 let node;while((node=walker.nextNode())){
   if(node.parentElement?.closest("script,style,#summary"))continue;
   if(node.__sourceText===undefined)node.__sourceText=node.nodeValue;const original=node.__sourceText;node.nodeValue=original;
   if(!original.trim())continue;
   const trimmed=original.trim();
   const translated=tr(trimmed);
   if(translated!==trimmed)node.nodeValue=original.replace(trimmed,translated);
   else if(locale==="en"){
     let replacement=trimmed;
     for(const [sr,en] of Object.entries(translations).sort((a,b)=>b[0].length-a[0].length)){
       if(replacement.includes(sr))replacement=replacement.split(sr).join(en);
     }
     if(replacement!==trimmed)node.nodeValue=original.replace(trimmed,replacement);
   }
 }
}
function render(){renderBase();localizeUI()}
document.getElementById("lang").onclick=()=>{locale=locale==="sr"?"en":"sr";render();setTheme();localizeUI()};

render();
